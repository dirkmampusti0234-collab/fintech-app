<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletPro - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Dashboard</h1>
    </header>

    <main>
        <!-- Balance Card -->
        <div class="card balance-card">
            <p style="color: var(--text-muted);">Total Available Balance</p>
            <div class="balance-amount">₱24,550.00</div>
            <p style="font-size: 0.85rem; color: #4ade80;">↑ +12.4% this month</p>
        </div>

        <!-- Quick Actions -->
        <div class="card">
            <h3 style="margin-bottom: 1rem; font-size: 1rem; color: var(--neon-cyan);">Quick Actions</h3>
            <a href="add-expense.html" class="btn" style="margin-top: 0;">+ Add New Transaction</a>
        </div>

        <!-- Summary Preview -->
        <div class="card">
            <h3 style="margin-bottom: 0.5rem; font-size: 1rem;">Recent Activity Summary</h3>
            <p style="font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem;">You have 3 transactions recorded this week.</p>
            <a href="transactions.html" style="color: var(--neon-cyan); text-decoration: none; font-size: 0.9rem;">View Full History →</a>
        </div>
    </main>

    <!-- App Bottom Navigation -->
    <nav class="app-nav">
        <a href="dashboard.html" class="active">
            <span>🏠</span> Dashboard
        </a>
        <a href="transactions.html">
            <span>📊</span> Transactions
        </a>
        <a href="add-expense.html">
            <span>➕</span> Add
        </a>
        <a href="confirmation.html">
            <span>❓</span> Help & Info
        </a>
    </nav>

</body>
</html>
