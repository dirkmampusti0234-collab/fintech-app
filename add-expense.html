<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletPro - Add Transaction</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>New Transaction</h1>
    </header>

    <main>
        <div class="card">
            <form action="confirmation.html" method="GET">
                <div class="form-group">
                    <label for="desc">Transaction Description</label>
                    <input type="text" id="desc" name="desc" required placeholder="e.g., Bookstore, Grocery">
                </div>

                <div class="form-group">
                    <label for="amount">Amount (₱)</label>
                    <input type="number" id="amount" name="amount" step="0.01" required placeholder="0.00">
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category" name="category" required>
                        <option value="">Select category...</option>
                        <option value="food">Food & Dining</option>
                        <option value="school">School Supplies</option>
                        <option value="transport">Transportation</option>
                        <option value="income">Allowance / Income</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" name="date" required>
                </div>

                <button type="submit" class="btn">Save Transaction</button>
            </form>
        </div>
    </main>

    <nav class="app-nav">
        <a href="dashboard.html">
            <span>🏠</span> Dashboard
        </a>
        <a href="transactions.html">
            <span>📊</span> Transactions
        </a>
        <a href="add-expense.html" class="active">
            <span>➕</span> Add
        </a>
        <a href="confirmation.html">
            <span>❓</span> Help & Info
        </a>
    </nav>

</body>
</html>
