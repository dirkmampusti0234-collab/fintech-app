<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WalletPro - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>WalletPro FinTech</h1>
    </header>

    <main>
        <div class="card" style="text-align: center; margin-top: 2rem;">
            <h2>Welcome Back</h2>
            <p style="color: var(--text-muted); margin-top: 0.5rem; margin-bottom: 1.5rem;">Secure Mobile Expense Tracking</p>
            
            <form action="dashboard.html" method="GET">
                <div class="form-group" style="text-align: left;">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" required placeholder="user@mapua.edu.ph">
                </div>
                
                <div class="form-group" style="text-align: left;">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn">Login to Dashboard</button>
            </form>
        </div>
    </main>

</body>
</html>
